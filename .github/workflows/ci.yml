name: ROSCA CI

on:
  push:
    branches: [master, evolution/**]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m py_compile app.py app_v2.py engine/*.py application/*.py components/*.py
      - run: pytest -q
